name: Build Binaries (Debian 12)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential git ca-certificates libssl-dev pkg-config
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . $HOME/.cargo/env
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-auth-linux-x86_64
          path: target/release/steam-auth
